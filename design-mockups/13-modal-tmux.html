<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mockup 13 — Project Window: tmux Split (image pane + README pane)</title>
  <style>
    :root {
      --bg: #050805;
      --panel: #0a120c;
      --panel-2: #0d1810;
      --green: #4af26c;
      --green-dim: #2c9648;
      --green-faint: rgba(74, 242, 108, 0.14);
      --amber: #ffc04c;
      --text: #b8e6c4;
      --muted: #6f9b7c;
      --border: rgba(74, 242, 108, 0.28);
    }

    * {
      box-sizing: border-box;
      margin: 0;
    }

    body {
      font-family: "SF Mono", ui-monospace, Menlo, Monaco, "Cascadia Mono", Consolas, monospace;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      font-size: 14px;
      overflow-x: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    ::selection {
      background: var(--green);
      color: #000;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 999;
      pointer-events: none;
      background: repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.22) 0 1px, transparent 1px 3px);
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 998;
      pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 55%, rgba(0, 10, 2, 0.55) 100%);
      animation: flicker 4s infinite;
    }

    @keyframes flicker {

      0%,
      100% {
        opacity: 1;
      }

      92% {
        opacity: 1;
      }

      93% {
        opacity: 0.86;
      }

      94% {
        opacity: 1;
      }

      97% {
        opacity: 0.93;
      }
    }

    .container {
      max-width: 1060px;
      margin: 0 auto;
      padding: 0 1.5rem;
    }

    .section {
      padding: 60px 0 90px;
    }

    .sec-cmd {
      color: var(--muted);
      margin-bottom: 8px;
    }

    .sec-cmd .u {
      color: var(--green);
    }

    .sec-cmd .h {
      color: var(--amber);
    }

    .sec-cmd .cmd {
      color: var(--text);
    }

    .sec-note {
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 26px;
    }

    .sec-note::before {
      content: "# ";
      color: var(--green-dim);
    }

    /* Projects grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 22px;
    }

    @media (max-width: 820px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }

    .pcard {
      background: var(--panel);
      border: 1px solid var(--border);
      transition: all .2s;
      display: flex;
      flex-direction: column;
      cursor: pointer;
    }

    .pcard:hover {
      border-color: var(--green);
      box-shadow: 0 0 22px rgba(74, 242, 108, 0.18);
    }

    .pcard .bar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      background: var(--panel-2);
      border-bottom: 1px solid var(--border);
      color: var(--muted);
      font-size: 12px;
    }

    .dots {
      display: flex;
      gap: 7px;
    }

    .dots i {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    .dots i:nth-child(1) {
      background: #ff5f56;
    }

    .dots i:nth-child(2) {
      background: #ffbd2e;
    }

    .dots i:nth-child(3) {
      background: #27c93f;
    }

    .pmedia {
      height: 210px;
      overflow: hidden;
      border-bottom: 1px solid var(--border);
      position: relative;
    }

    .pmedia img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top left;
      display: block;
      filter: grayscale(1) sepia(1) hue-rotate(70deg) saturate(2.4) brightness(0.82) contrast(1.05);
      transition: filter .35s ease, transform .35s ease;
    }

    .pcard:hover .pmedia img {
      filter: none;
      transform: scale(1.04);
    }

    .pmedia::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.15) 0 1px, transparent 1px 3px);
    }

    .pmedia .count {
      position: absolute;
      right: 8px;
      bottom: 8px;
      z-index: 2;
      background: rgba(5, 8, 5, 0.85);
      border: 1px solid var(--border);
      color: var(--green);
      font-size: 11px;
      padding: 1px 8px;
    }

    .pbody {
      padding: 16px 18px 18px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .pbody h3 {
      font-size: 15px;
      color: #eafff0;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .pbody h3::before {
      content: "> ";
      color: var(--green);
    }

    .pcard:hover h3 {
      color: var(--green);
      text-shadow: 0 0 8px rgba(74, 242, 108, 0.5);
    }

    .pbody p {
      color: var(--muted);
      font-size: 12.5px;
      flex: 1;
    }

    .pbody .open-hint {
      margin-top: 12px;
      color: var(--green-dim);
      font-size: 11.5px;
    }

    .pcard:hover .open-hint {
      color: var(--amber);
    }

    /* ============ MODAL — tmux session ============ */
    /* z-index above the page CRT overlay (999) so images render with zero grain */
    .overlay {
      position: fixed;
      inset: 0;
      z-index: 1500;
      display: none;
      background: rgba(2, 5, 2, 0.82);
      backdrop-filter: blur(3px);
      align-items: center;
      justify-content: center;
      padding: 22px;
    }

    .overlay.on {
      display: flex;
    }

    .tmux {
      width: min(1140px, 97vw);
      height: min(720px, 90vh);
      display: flex;
      flex-direction: column;
      background: var(--bg);
      border: 1px solid rgba(74, 242, 108, 0.45);
      box-shadow: 0 0 40px rgba(74, 242, 108, 0.14);
    }

    .overlay.on .tmux {
      animation: attach .25s ease-out;
    }

    @keyframes attach {
      0% {
        opacity: 0;
        transform: scale(0.97) translateY(10px);
      }

      100% {
        opacity: 1;
        transform: none;
      }
    }

    .panes {
      flex: 1;
      display: flex;
      min-height: 0;
    }

    @media (max-width: 900px) {
      .panes {
        flex-direction: column;
      }
    }

    .pane {
      position: relative;
      border: 1px solid rgba(74, 242, 108, 0.2);
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
    }

    .pane.active {
      border-color: rgba(74, 242, 108, 0.45);
    }

    .pane .ptitle {
      position: absolute;
      top: -9px;
      left: 14px;
      z-index: 2;
      background: var(--bg);
      color: var(--muted);
      font-size: 11.5px;
      padding: 0 7px;
    }

    .pane.active .ptitle {
      color: var(--green);
    }

    .pane .ptitle::before {
      content: "┤ ";
      color: var(--green-dim);
    }

    .pane .ptitle::after {
      content: " ├";
      color: var(--green-dim);
    }

    .pane-img {
      flex: 1.35;
      margin: 6px 3px 6px 6px;
    }

    .pane-doc {
      flex: 1;
      margin: 6px 6px 6px 3px;
    }

    @media (max-width: 900px) {
      .pane-img {
        flex: 1.2;
        margin: 6px 6px 3px 6px;
      }

      .pane-doc {
        flex: 1;
        margin: 3px 6px 6px 6px;
      }
    }

    /* image pane — clear by default; phosphor tint is opt-in via toggle */
    .imgwrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      background: #030503;
      min-height: 0;
    }

    .imgwrap img {
      max-width: 100%;
      max-height: 100%;
      display: block;
      animation: img-in .18s ease;
    }

    @keyframes img-in {
      0% {
        opacity: 0;
        transform: translateX(6px);
      }

      100% {
        opacity: 1;
        transform: none;
      }
    }

    /* tint = hazy CRT look, original colors kept (matches mockup 12's default) */
    .imgwrap.tinted img {
      filter: brightness(0.92) contrast(1.03);
    }

    .imgwrap.tinted::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.22) 0 1px, transparent 1px 3px),
        radial-gradient(ellipse at center, transparent 60%, rgba(0, 10, 2, 0.35) 100%);
    }

    .navbtn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      z-index: 3;
      background: rgba(5, 8, 5, 0.85);
      color: var(--green);
      border: 1px solid var(--border);
      font-family: inherit;
      font-size: 18px;
      line-height: 1;
      padding: 12px 10px;
      cursor: pointer;
      transition: all .15s;
    }

    .navbtn:hover {
      border-color: var(--green);
      box-shadow: 0 0 14px rgba(74, 242, 108, 0.35);
    }

    .navbtn.prev {
      left: 10px;
    }

    .navbtn.next {
      right: 10px;
    }

    .navbtn.hidden {
      display: none;
    }

    .imgstatus {
      display: flex;
      gap: 12px;
      padding: 4px 10px;
      font-size: 11.5px;
      color: var(--muted);
      border-top: 1px solid rgba(74, 242, 108, 0.2);
      background: var(--panel);
      flex-shrink: 0;
      overflow: hidden;
      white-space: nowrap;
    }

    .imgstatus .f {
      color: var(--amber);
    }

    .imgstatus .cap {
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .imgstatus .tint {
      margin-left: auto;
      cursor: pointer;
      flex-shrink: 0;
      user-select: none;
      border: 1px solid var(--border);
      padding: 0 8px;
      transition: all .15s;
    }

    .imgstatus .tint:hover {
      color: var(--green);
      border-color: var(--green);
    }

    .imgstatus .tint b {
      color: var(--green);
      font-weight: 400;
    }

    /* doc pane */
    .doc {
      flex: 1;
      overflow-y: auto;
      padding: 18px 20px 24px;
      min-height: 0;
    }

    .doc::-webkit-scrollbar {
      width: 10px;
    }

    .doc::-webkit-scrollbar-thumb {
      background: var(--green-dim);
      border: 2px solid var(--bg);
    }

    .doc::-webkit-scrollbar-track {
      background: var(--panel);
    }

    .doc .h {
      color: var(--amber);
      font-size: 12px;
      letter-spacing: 1.5px;
      margin: 18px 0 6px;
    }

    .doc .h:first-child {
      margin-top: 0;
    }

    .doc h2 {
      color: #eafff0;
      font-size: 17px;
      margin-bottom: 2px;
    }

    .doc h2::before {
      content: "> ";
      color: var(--green);
    }

    .doc .sub {
      color: var(--green-dim);
      font-size: 12px;
      margin-bottom: 4px;
    }

    .doc p {
      color: var(--muted);
      font-size: 12.5px;
      margin: 6px 0;
    }

    .doc ul {
      list-style: none;
    }

    .doc ul li {
      color: var(--muted);
      font-size: 12.5px;
      padding: 1px 0;
    }

    .doc ul li::before {
      content: "[x] ";
      color: var(--green);
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 4px;
    }

    .tag {
      font-size: 11px;
      color: var(--green);
      border: 1px solid var(--border);
      padding: 1px 8px;
      background: rgba(74, 242, 108, 0.05);
    }

    .tag::before {
      content: "[";
      color: var(--green-dim);
    }

    .tag::after {
      content: "]";
      color: var(--green-dim);
    }

    .plinks {
      margin-top: 4px;
    }

    .plinks a {
      color: var(--amber);
      font-size: 12.5px;
      border-bottom: 1px dashed rgba(255, 192, 76, 0.5);
      margin-right: 16px;
    }

    .plinks a::before {
      content: "↗ ";
    }

    .plinks a:hover {
      color: #ffd685;
      border-bottom-style: solid;
    }

    .doc .eof {
      color: var(--green-dim);
      margin-top: 18px;
      font-size: 12px;
    }

    /* tmux status bar */
    .status {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 14px;
      background: var(--green-dim);
      color: #04140a;
      font-size: 12px;
      font-weight: 700;
      padding: 3px 10px;
      overflow: hidden;
      white-space: nowrap;
    }

    .status .sess {
      background: #04140a;
      color: var(--green-dim);
      padding: 0 8px;
      flex-shrink: 0;
    }

    .status .wins {
      display: flex;
      gap: 4px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .status .wins::-webkit-scrollbar {
      display: none;
    }

    .status .win {
      cursor: pointer;
      padding: 0 7px;
      font-weight: 400;
    }

    .status .win:hover {
      background: rgba(4, 20, 10, 0.18);
    }

    .status .win.cur {
      background: #04140a;
      color: var(--amber);
      font-weight: 700;
    }

    .status .right {
      margin-left: auto;
      font-weight: 400;
      flex-shrink: 0;
      display: flex;
      gap: 14px;
      align-items: center;
    }

    .status .right .quit {
      cursor: pointer;
      background: #04140a;
      color: #ff5f56;
      padding: 0 8px;
    }

    .status .right .quit:hover {
      color: #ff8a80;
    }

    @media (max-width: 700px) {
      .status .right .hint {
        display: none;
      }
    }
  </style>
</head>

<body>

  <section class="section">
    <div class="container">
      <div class="sec-cmd"><span class="u">bidhan@uta</span>:<span class="h">~/portfolio</span>$ <span class="cmd">ls
          -la ./projects/</span></div>
      <p class="sec-note">mockup 13 · click any project → tmux session attaches: screenshots in the left pane, README.md
        scrolls in the right. windows in the status bar switch pictures.</p>
      <div class="grid" id="grid"></div>
    </div>
  </section>

  <div class="overlay" id="overlay">
    <div class="tmux" role="dialog" aria-modal="true">
      <div class="panes">
        <div class="pane pane-img active" id="paneImg">
          <span class="ptitle" id="ptitleImg">0: feh</span>
          <div class="imgwrap" id="imgwrap">
            <img id="mimg" src="" alt="" />
            <button class="navbtn prev" id="prev" aria-label="previous">&lsaquo;</button>
            <button class="navbtn next" id="next" aria-label="next">&rsaquo;</button>
          </div>
          <div class="imgstatus">
            <span class="f" id="midx"></span><span class="cap" id="mcap"></span>
            <span class="tint" id="tintbtn">tint: <b>off</b></span>
          </div>
        </div>
        <div class="pane pane-doc" id="paneDoc">
          <span class="ptitle">1: less README.md</span>
          <div class="doc" id="doc"></div>
        </div>
      </div>
      <div class="status">
        <span class="sess" id="sess">[studymate]</span>
        <div class="wins" id="wins"></div>
        <div class="right">
          <span class="hint">←/→ imgs · t tint · esc quit</span>
          <span class="quit" id="mclose">✕ detach</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    const A = "../public/assets/";
    const projects = [
      {
        name: "StudyMate", slug: "studymate", stack: ["FastAPI", "LangChain", "pgvector", "React 19"],
        short: "A retrieval augmented study assistant over your own PDFs. Answers are grounded in retrieved chunks and cited to filename and page, and questions the corpus can't answer get a refusal, not a hallucination.",

        long: [

        ],
        features: [
          "Grounded Q&A — every claim cited to filename, page N",
          "\"Explain like I'm a beginner\" mode",
          "Flashcards with a flip-card review UI",
          "LLM-graded quizzes with partial credit",
          "RAG made a 634-page book ~240× cheaper to query",
          "Eval: 52 hand-verified questions, recall@6 = 0.92",
        ],
        links: [{ label: "GitHub", href: "https://github.com/bidhankhadka11/StudyMate" }],
        images: [
          { win: "chat", src: A + "studymate.png", cap: "grounded answers with per-page citations" },
          { win: "explain", src: A + "studymate-explain.png", cap: "beginner mode — analogy-driven, still grounded" },
          { win: "flashcards", src: A + "studymate-flashcards.png", cap: "generated from the document, click to flip" },
          { win: "quiz", src: A + "studymate-quiz.png", cap: "LLM-graded with partial credit + explanations" },
        ],
      },
      {
        name: "Production LangGraph API", slug: "langgraph-api", stack: ["FastAPI", "LangGraph", "Docker", "LangSmith"],
        short: "A production grade LLM chat API. A single POST /chat endpoint wrapped in prompt-injection blocking, PII masking, response caching, rate limiting, and cross-provider model fallback. 61 tests at 100% coverage.",

        long: [

        images: [{ win: "docs", src: A + "langgraph-api.png", cap: "Swagger UI of the live deployed API" }],
      },
      {
        name: "Rarify", slug: "rarify", stack: ["Kotlin", "Compose", "Material 3", "SQLite"],
        short: "A native Android marketplace for buying and selling rare collectibles, where a single account switches between buyer, seller, and admin roles.",
        sub: "native Android marketplace",
        long: ["A native Android marketplace for rare collectibles where one account switches between buyer, seller, and admin roles. Jetpack Compose + Material 3, with admin moderation and persisted themes."],
        features: ["Buyer / seller / admin role switching", "Admin moderation of listings", "Persisted Material 3 themes", "SQLite persistence"],
        links: [{ label: "GitHub", href: "https://github.com/bidhankhadka11/rarify-marketplace" }],
        images: [{ win: "home", src: A + "rarify.png", cap: "marketplace home" }],
      },
      {
        name: "Software Defect Classifier", slug: "defect-classifier", stack: ["Python", "sklearn", "pandas", "RF-200"],
        short: "A Kaggle binary-classification project that predicts whether a C code module contains a defect from its complexity metrics.",

        features: ["Class-balanced RF (200 trees)", "RobustScaler preprocessing", "~0.79 ROC-AUC"],
        links: [{ label: "GitHub", href: "https://github.com/bidhankhadka11/binaryclassification" }],
        images: [{ win: "notebook", src: A + "binaryclassification.png", cap: "feature exploration" }],
      },
      {
        name: "FitJournal", slug: "fitjournal", stack: ["React", "Node", "Express", "MongoDB"],

        links: [{ label: "GitHub", href: "https://github.com/bidhankhadka11/Workout-Buddy" }],
        images: [{ win: "log", src: A + "fitjournal.png", cap: "workout log" }],
      },
      {
        name: "PersonaAI", slug: "persona-ai", stack: ["React", "Express", "Gemini API"],
        short: "A conversational AI chatbot powered by Google's Gemini API with selectable personalities like Neko, Shadow, and Sloth.",
        sub: "conversational AI chatbot",
        long: ["A Gemini-powered chatbot with selectable personalities — Neko, Shadow, Sloth. React frontend → Express /chat endpoint; real-time replies with full history."],
        features: ["Personality system prompts", "React → Express /chat", "Full conversation history"],
        links: [{ label: "GitHub", href: "https://github.com/bidhankhadka11/AI-Chatbot" }],
        images: [{ win: "chat", src: A + "persona.png", cap: "chat with Neko" }],
      },
      {
        name: "Genetic Algorithm", slug: "genetic-algorithm", stack: ["Java", "OOP"],
        short: "A Java genetic algorithm that evolves a population of random character strings toward a target phrase.",
        sub: "evolutionary computation in Java",
        long: ["Evolves random character strings toward a target phrase. Elitist selection, single-point crossover, rate-based mutation in a clean OO design."],
        features: ["Elitist selection", "Single-point crossover", "Rate-based mutation"],
        links: [{ label: "GitHub", href: "https://github.com/bidhankhadka11/Genetic-Algorithm" }],
        images: [{ win: "run", src: A + "genetic.png", cap: "generations converging" }],
      },
      {
        name: "Event-Driven Game", slug: "flappy-swing", stack: ["Java", "Swing"],
        short: "A Java Swing recreation of Flappy Bird with custom-rendered sprites and scrolling background.",
        sub: "Java Swing game",
        long: ["A Swing recreation of Flappy Bird with custom sprites and scrolling background. Swing Timer loop, KeyListener input, collision detection, live score, instant restart."],
        features: ["Swing Timer game loop", "Collision detection", "Live score + restart"],
        links: [{ label: "GitHub", href: "https://github.com/bidhankhadka11/Flappy-Bird-on-java" }],
        images: [{ win: "game", src: A + "flappy.png", cap: "mid-flight" }],
      },
    ];

    /* ---- grid ---- */
    const grid = document.getElementById("grid");
    projects.forEach((p, i) => {
      const el = document.createElement("article");
      el.className = "pcard";
      el.innerHTML = `
    <div class="bar"><div class="dots"><i></i><i></i><i></i></div>~/projects/${p.slug}</div>
    <div class="pmedia"><img src="${p.images[0].src}" alt="${p.name}" />
      ${p.images.length > 1 ? `<span class="count">${p.images.length} imgs</span>` : ""}
    </div>
    <div class="pbody">
      <h3>${p.name}</h3><p>${p.short}</p>
      <div class="open-hint">$ tmux attach -t ${p.slug} &nbsp;⏎</div>
    </div>`;
      el.addEventListener("click", () => openModal(i));
      grid.appendChild(el);
    });

    /* ---- modal ---- */
    const overlay = document.getElementById("overlay");
    let cur = 0, imgIdx = 0, tinted = false;

    function openModal(i) {
      cur = i; imgIdx = 0;
      const p = projects[i];
      document.getElementById("sess").textContent = `[${p.slug}]`;
      document.getElementById("doc").innerHTML = `
    <div class="h">NAME</div>
    <h2>${p.name}</h2>
    <div class="sub">${p.sub}</div>
    <div class="h">DESCRIPTION</div>
    ${p.long.map(t => `<p>${t}</p>`).join("")}
    <div class="h">FEATURES</div>
    <ul>${p.features.map(f => `<li>${f}</li>`).join("")}</ul>
    <div class="h">STACK</div>
    <div class="tags">${p.stack.map(s => `<span class="tag">${s}</span>`).join("")}</div>
    <div class="h">LINKS</div>
    <div class="plinks">${p.links.map(l => `<a href="${l.href}" target="_blank" rel="noreferrer">${l.label}</a>`).join("")}</div>
    <div class="eof">(END)</div>`;
      const wins = document.getElementById("wins");
      wins.innerHTML = p.images.map((im, k) => `<span class="win" data-k="${k}">${k}:${im.win}</span>`).join("");
      wins.querySelectorAll(".win").forEach(w =>
        w.addEventListener("click", e => { e.stopPropagation(); setImg(+w.dataset.k); }));
      const multi = p.images.length > 1;
      document.getElementById("prev").classList.toggle("hidden", !multi);
      document.getElementById("next").classList.toggle("hidden", !multi);
      setImg(0);
      overlay.classList.add("on");
      document.body.style.overflow = "hidden";
    }
    function setImg(k) {
      const p = projects[cur];
      imgIdx = (k + p.images.length) % p.images.length;
      const im = p.images[imgIdx];
      const img = document.getElementById("mimg");
      img.src = "";
      requestAnimationFrame(() => { img.src = im.src; });
      document.getElementById("ptitleImg").textContent = `0: feh ${im.win}.png`;
      document.getElementById("midx").textContent = `[${imgIdx + 1}/${p.images.length}]`;
      document.getElementById("mcap").textContent = ` ${im.cap}`;
      document.querySelectorAll("#wins .win").forEach((w, j) => {
        w.classList.toggle("cur", j === imgIdx);
        if (j === imgIdx) w.textContent = `${j}:${p.images[j].win}*`;
        else w.textContent = `${j}:${p.images[j].win}`;
      });
    }
    function closeModal() { overlay.classList.remove("on"); document.body.style.overflow = ""; }

    document.getElementById("prev").addEventListener("click", e => { e.stopPropagation(); setImg(imgIdx - 1); });
    document.getElementById("next").addEventListener("click", e => { e.stopPropagation(); setImg(imgIdx + 1); });
    document.getElementById("mclose").addEventListener("click", closeModal);
    overlay.addEventListener("click", e => { if (e.target === overlay) closeModal(); });
    document.getElementById("tintbtn").addEventListener("click", e => {
      e.stopPropagation();
      tinted = !tinted;
      document.getElementById("imgwrap").classList.toggle("tinted", tinted);
      document.getElementById("tintbtn").innerHTML = `tint: <b>${tinted ? "on" : "off"}</b>`;
    });
    ["paneImg", "paneDoc"].forEach(id =>
      document.getElementById(id).addEventListener("click", () => {
        document.querySelectorAll(".pane").forEach(pn => pn.classList.remove("active"));
        document.getElementById(id).classList.add("active");
      }));
    document.addEventListener("keydown", e => {
      if (!overlay.classList.contains("on")) return;
      if (e.key === "Escape") closeModal();
      if (e.key === "ArrowLeft") setImg(imgIdx - 1);
      if (e.key === "ArrowRight") setImg(imgIdx + 1);
      if (e.key === "t") document.getElementById("tintbtn").click();
    });

    window.addEventListener("load", () => setTimeout(() => openModal(0), 400));
  </script>
</body>

</html>
